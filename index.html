<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bluu Game Hub</title>
<script>try{var t=localStorage.getItem("gl-theme");document.documentElement.dataset.theme=t||"blue"}catch(e){document.documentElement.dataset.theme="blue"}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M30 10c0-4 3-6 6-6v5c-2 0-3 1-3 3z' fill='%2342a64a'/%3E%3Cpath d='M32 16c-8-5-26-3-26 17 0 15 10 22 26 22s26-7 26-22c0-20-18-22-26-17z' fill='%23ff7a18'/%3E%3Cpath d='M20 30l7 6-14 0zM44 30l7 6-14 0zM20 44q12 9 24 0l-4 5-4-3-4 3-4-3z' fill='%23190a05'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#090307; --bgr:9,3,7; --pn:26,9,15; --pn2:48,16,26; --panel:#12060b; --panel2:#1d0a12;
  --ac:240,86,120; --text:#fbeaf0; --dim:#b38c99; --dim2:#cfa9b5; --mute:#8c6572; --mute2:#5f3f4a;
  --sb:#4a1a2a; --tabA:#2b0e18; --tabB:#190910; --rvtext:#ecd3db; --subc:#f3b4c4;
  --pumpkin:#f05a7e; --ember:#c8284f; --gold:#ffa6bd; --wisp:#ff7aa2; --slime:#8dff5c;
  --line:rgba(var(--ac),.15); --line2:rgba(var(--ac),.32);
  --glow:0 0 0 1px rgba(var(--ac),.55),0 0 22px rgba(var(--ac),.38);
  --ease:cubic-bezier(.16,1,.3,1);
  --mono:"Roboto Mono",Cousine,ui-monospace,"Courier New",monospace;
  --sans:Inter,Roboto,"Segoe UI","Noto Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--pumpkin);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--pumpkin);background-clip:padding-box}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:44px minmax(0,1fr);height:100%;position:relative;z-index:2}
#rail{display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;border-right:1px solid var(--line);background:rgba(var(--bgr),.82)}
#rail .grow{flex:1}
.rb{position:relative;width:36px;height:34px;border:0;background:none;border-radius:9px;display:grid;place-items:center;color:var(--mute);transition:color .2s,background .2s}
.rb:hover{color:var(--text);background:rgba(var(--ac),.09)}
.rb.on{color:var(--pumpkin)}
.rb.on::before{content:"";position:absolute;left:-4px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--pumpkin);box-shadow:0 0 12px var(--pumpkin)}
.rb[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:44px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--panel2);border:1px solid var(--line2);padding:4px 9px;border-radius:8px;font-size:.76rem;color:var(--text);z-index:50;pointer-events:none}
#main{display:flex;flex-direction:column;min-width:0;background:rgba(var(--bgr),.5)}

/* tabs */
#tabstrip{display:flex;align-items:flex-end;gap:4px;height:38px;padding:5px 8px 0;border-bottom:1px solid var(--line);background:rgba(var(--bgr),.82)}
#tabs{display:flex;gap:4px;min-width:0;flex:0 1 auto;max-width:100%}
.tab{position:relative;display:flex;align-items:center;gap:8px;height:32px;width:190px;min-width:60px;flex:0 1 190px;padding:0 6px 0 11px;border-radius:9px 9px 0 0;border:1px solid transparent;border-bottom:0;background:none;color:var(--mute);font-size:.8rem;text-align:left;transition:background .2s,color .2s;animation:tabIn .35s var(--ease) both;overflow:hidden}
.tab:hover{background:rgba(var(--ac),.07);color:var(--text)}
.tab.on{background:linear-gradient(var(--tabA),var(--tabB));border-color:var(--line2);color:var(--text)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;top:0;height:2px;border-radius:2px;background:var(--pumpkin);box-shadow:0 0 10px var(--pumpkin)}
.tab.gone{animation:tabOut .22s ease forwards}
.tab svg.i{width:14px;height:14px}
.tab .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .tx{width:20px;height:20px;border:0;border-radius:6px;background:none;display:grid;place-items:center;color:inherit;opacity:.55;flex:none}
.tab .tx:hover{opacity:1;background:rgba(255,255,255,.1)}
.tab .tx svg{width:11px;height:11px}
#newtab{width:28px;height:28px;margin-bottom:2px;border:0;border-radius:8px;background:none;color:var(--mute);display:grid;place-items:center;flex:none}
#newtab:hover{background:rgba(var(--ac),.1);color:var(--text)}
@keyframes tabIn{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
@keyframes tabOut{to{opacity:0;transform:scale(.8);flex-basis:0;width:0;min-width:0;padding:0}}

/* toolbar */
#bar{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-bottom:1px solid var(--line);background:rgba(var(--bgr),.82);position:relative}
.tb{width:32px;height:32px;border:0;border-radius:9px;background:none;display:grid;place-items:center;color:var(--dim2);flex:none;transition:background .2s,color .2s,transform .2s}
.tb:hover:not(:disabled){background:rgba(var(--ac),.11);color:#fff}
.tb:active:not(:disabled){transform:scale(.9)}
.tb:disabled{opacity:.28;cursor:default}
.tb.on{color:var(--gold)}
.tb.on svg{fill:var(--gold)}
#spin.spinning svg{animation:spin .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes spin{to{transform:rotate(360deg)}}
#addr{flex:1;display:flex;align-items:center;gap:9px;height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(var(--pn),.7);min-width:0;transition:border-color .2s,box-shadow .2s}
#addr:focus-within{border-color:var(--pumpkin);box-shadow:var(--glow)}
#addr .pk{width:16px;height:16px;flex:none}
#url{flex:1;min-width:0;background:none;border:0;outline:0;font:.8rem var(--mono);letter-spacing:.01em}
#mini{display:flex;align-items:center;gap:2px;height:32px;padding:0 4px 0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(var(--pn),.7);flex:none}
#mini .mt{display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--dim);font-size:.74rem;max-width:150px;padding:0;height:100%}
#mini .mt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini.live .mt{color:var(--text)}
#mini .tb{width:26px;height:26px;border-radius:7px}
#mini .tb svg{width:14px;height:14px}
#load{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:linear-gradient(90deg,var(--wisp),var(--pumpkin),var(--gold));box-shadow:0 0 10px var(--pumpkin);opacity:0;pointer-events:none}
#load.run{animation:load .75s var(--ease) forwards}
@keyframes load{0%{width:0;opacity:1}70%{width:92%;opacity:1}100%{width:100%;opacity:0}}

/* stage + window animation */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:
  radial-gradient(circle,rgba(var(--ac),.075) 1px,transparent 1.5px) 0 0/24px 24px}
.view{position:absolute;inset:0;overflow:auto;transform-origin:var(--ox,50%) var(--oy,50%)}
.view.in{animation:viewIn .62s var(--ease) backwards}
.view.out{animation:viewOut .26s cubic-bezier(.5,0,.75,0) both;pointer-events:none}
@keyframes viewIn{0%{opacity:0;transform:scale(1.16)}35%{opacity:1}100%{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:scale(.9)}}
#veil{position:absolute;inset:0;pointer-events:none;z-index:30;opacity:0}
#veil.pulse{animation:veil .7s ease-out}
#veil::before{content:"";position:absolute;left:var(--ox,50%);top:var(--oy,50%);width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;background:radial-gradient(circle,transparent 61%,rgba(var(--ac),.6) 65%,rgba(var(--ac),.22) 71%,transparent 77%)}
@keyframes veil{0%{opacity:1}100%{opacity:1}}
#veil.pulse{animation:veil .8s}
#veil.pulse::before{animation:ring .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(26);opacity:0}}
#foot{white-space:pre;position:absolute;right:16px;bottom:10px;font:.68rem var(--mono);color:var(--mute2);text-align:right;pointer-events:none;z-index:3;line-height:1.5}

/* ---------- ambience ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(900px 520px at 58% 36%,rgba(var(--ac),.10),transparent 65%),
  radial-gradient(700px 500px at 8% 100%,rgba(var(--ac),.05),transparent 65%),var(--bg)}
html[data-theme="halloween"] #glow{background:
  radial-gradient(900px 520px at 58% 36%,rgba(255,92,24,.13),transparent 65%),
  radial-gradient(700px 500px at 8% 100%,rgba(120,60,255,.16),transparent 65%),
  radial-gradient(600px 400px at 100% 0,rgba(255,60,20,.09),transparent 65%),var(--bg)}
.fog{position:fixed;left:-20%;right:-20%;bottom:-6%;height:34%;z-index:1;pointer-events:none;opacity:.55;
  background:radial-gradient(40% 70% at 20% 80%,rgba(150,110,220,.2),transparent 70%),radial-gradient(35% 60% at 62% 90%,rgba(255,130,60,.12),transparent 70%),radial-gradient(40% 70% at 90% 80%,rgba(150,110,220,.18),transparent 70%);
  animation:fog 22s ease-in-out infinite alternate}
.fog.b{bottom:-12%;opacity:.4;animation-duration:31s;animation-direction:alternate-reverse}
@keyframes fog{from{transform:translateX(-5%)}to{transform:translateX(7%)}}
#vig{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 55% 45%,transparent 55%,rgba(0,0,0,.6))}
html.playing #fx,html.playing #vig,html.playing .fog,html.playing #foot{display:none}

/* boot: lightning + fade */
#boot{position:fixed;inset:0;z-index:80;background:#050208;pointer-events:none;animation:bootOut .9s ease .75s forwards}
#flash{position:fixed;inset:0;z-index:81;pointer-events:none;background:radial-gradient(circle at 60% 20%,#fff,#d9c6ff 35%,#5d2bb8 80%);opacity:0;animation:flash 1.3s linear .35s forwards}
@keyframes bootOut{to{opacity:0;visibility:hidden}}
@keyframes flash{0%{opacity:0}6%{opacity:.85}14%{opacity:.05}24%{opacity:.55}34%{opacity:0}100%{opacity:0}}
#shell.boot{animation:shellIn 1s var(--ease) .8s both}
@keyframes shellIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}

/* ---------- HOME ---------- */
#v-home{display:flex;flex-direction:column}
.hwrap{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px 20px 8px;text-align:center;position:relative}
.moon{position:absolute;top:18px;right:6%;width:96px;height:96px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 36% 34%,#fff6e2,#f3d9a8 55%,#d9b177);box-shadow:0 0 50px 8px rgba(255,205,130,.35),0 0 140px 40px rgba(255,150,60,.18);opacity:.9}
.moon::before{content:"";position:absolute;left:54%;top:22%;width:17px;height:17px;border-radius:50%;background:rgba(150,100,50,.2);box-shadow:-30px 34px 0 4px rgba(150,100,50,.16),12px 40px 0 -2px rgba(150,100,50,.14)}
.web{position:absolute;top:0;left:0;width:200px;height:200px;pointer-events:none;opacity:.5}
.web path{fill:none;stroke:#cdb7e6;stroke-width:1;stroke-linecap:round}
.logo{position:relative;width:min(560px,86vw);filter:drop-shadow(0 0 14px rgba(var(--ac),.55)) drop-shadow(0 0 46px rgba(var(--ac),.35))}
.logo svg{display:block;width:100%;height:auto;overflow:visible}
.lg{animation:bob 4.2s ease-in-out infinite;animation-delay:calc(var(--i) * -.45s)}
.lg.fl{animation:bob 4.2s ease-in-out infinite,flick 6s steps(1) infinite}
.lp{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lp.t{stroke-width:15}
.lp.h{stroke:rgba(255,236,190,.8);stroke-width:3.2;transform:translate(-1.5px,-2px)}
.lp.d{stroke:#3a0d02;stroke-width:15;transform:translate(0,3px);opacity:.55}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flick{0%,86%,92%,100%{opacity:1}87%,91%{opacity:.25}89%{opacity:.7}}
.sub{margin:-2px 0 0;font-size:1rem;letter-spacing:.16em;color:var(--subc);text-shadow:0 0 14px rgba(var(--ac),.8);transition:opacity .45s,transform .45s}
.sub.swap{opacity:0;transform:translateY(6px)}
.sbar{display:flex;align-items:center;gap:10px;width:min(440px,90vw);height:42px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--pn),.78);transition:border-color .2s,box-shadow .2s;margin-top:6px}
.sbar:focus-within{border-color:var(--pumpkin);box-shadow:var(--glow)}
.sbar input{flex:1;background:none;border:0;outline:0;height:100%;min-width:0}
.sbar input::placeholder{color:var(--dim)}
.apps{display:flex;flex-wrap:wrap;justify-content:center;gap:20px 24px;max-width:760px;margin-top:8px}
.app{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:9px;width:70px;color:var(--text);font-size:.76rem;position:relative;padding:0}
.app .c{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:rgba(var(--pn),.8);display:grid;place-items:center;font-weight:800;font-size:1.2rem;transition:transform .3s var(--ease),border-color .2s,box-shadow .25s,background .25s}
.app svg.i{width:23px;height:23px}
.app:hover .c,.app:focus-visible .c{border-color:var(--pumpkin);box-shadow:var(--glow);transform:translateY(-4px) scale(1.07);background:rgba(var(--pn2),.85)}
.app:active .c{transform:scale(.93)}
.app .x{position:absolute;top:-5px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--sb);border:0;color:#fff;line-height:1;font-size:14px}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:rgba(var(--pn),.7);font-size:.78rem;color:var(--dim)}
.chip b{color:var(--text);font-weight:600}
button.chip{color:var(--text);transition:border-color .2s,box-shadow .2s}
button.chip:hover{border-color:var(--pumpkin);box-shadow:var(--glow)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--slime);box-shadow:0 0 8px var(--slime)}
.dot.wait{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.chip .ico{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pumpkin),var(--ember));color:#1a0700}
.chip .ico svg{width:12px;height:12px;stroke-width:2.4}

.reviews{flex:none;overflow:hidden;padding:16px 0 30px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.track{display:flex;width:max-content;animation:scroll var(--dur,80s) linear infinite}
.reviews:hover .track{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}
.rv{flex:none;width:310px;min-height:100px;margin-right:14px;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--pn),.8);text-align:left;transition:border-color .2s,box-shadow .2s}
.rv:hover{border-color:var(--line2);box-shadow:0 0 18px rgba(var(--ac),.2)}
.rv .who{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:.78rem}
.rv .av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:.8rem}
.rv b{color:#fff}
.rv .role{color:var(--dim)}
.rv p{margin:0;color:var(--rvtext);font-size:.84rem;line-height:1.45}

/* home boot sequence */
#v-home.boot .lp{stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) calc(1.3s + var(--i) * .13s) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
#v-home.boot .moon{animation:rise 1.4s var(--ease) 1.4s both}
#v-home.boot .sub,#v-home.boot .sbar,#v-home.boot .chips{animation:rise .9s var(--ease) 2.2s both}
#v-home.boot .app{animation:rise .8s var(--ease) calc(2.4s + var(--n,0) * .07s) both}
#v-home.boot .reviews{animation:rise 1s ease 3s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- generic inner pages ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:22px 26px 56px}
.ptop{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ptop h2{margin:0 8px 0 0;font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.ctl{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:rgba(var(--pn),.78);transition:border-color .2s,box-shadow .2s,color .2s,transform .2s;white-space:nowrap}
.ctl:hover{border-color:var(--pumpkin);color:#fff;box-shadow:0 0 14px rgba(var(--ac),.3)}
.ctl:active{transform:scale(.96)}
.ctl.pri{background:linear-gradient(135deg,var(--pumpkin),var(--ember));color:#1a0700;border-color:transparent;font-weight:700}
.ctl.pri:hover{color:#1a0700;box-shadow:0 0 22px rgba(var(--ac),.6)}
.ctl svg.i{width:16px;height:16px}
select.ctl{padding-right:8px}
option{background:var(--tabB)}
.inp{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:rgba(var(--pn),.78);min-width:200px;transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:0;border-color:var(--pumpkin);box-shadow:var(--glow)}
.inp::placeholder{color:var(--dim)}
textarea.inp{width:100%;height:60vh;padding:14px;resize:vertical;line-height:1.55}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.row .inp{flex:1}
.dim{color:var(--dim)}
.clk{font-size:clamp(2.4rem,9vw,4.6rem);font-weight:800;letter-spacing:-.02em;text-shadow:0 0 28px rgba(var(--ac),.55);margin:6px 0;font-variant-numeric:tabular-nums}
.trk{display:flex;width:100%;text-align:left;margin:6px 0}
.trk.on{border-color:var(--pumpkin);box-shadow:var(--glow)}
#seek{flex:1;min-width:120px;accent-color:var(--pumpkin)}
.hcount{display:inline-flex;align-items:center;gap:12px;padding:12px 18px;margin:8px 0 0;border-radius:14px;border:1px solid var(--line2);background:rgba(var(--pn2),.45);font-size:.95rem}
.hcount b{font-size:1.7rem;color:var(--gold);text-shadow:0 0 18px rgba(255,150,40,.6)}

/* start (folder picker) */
#v-start{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#v-start h1{margin:0;font-size:1.7rem}
#v-start p{margin:0;max-width:34rem;color:var(--dim)}
.link{background:none;border:0;color:var(--dim);text-decoration:underline;padding:4px}
.link:hover{color:var(--text)}
#err{color:#ff9d8a}

/* ---------- games library ---------- */
.tabs2{display:flex;gap:6px;margin:16px 0 18px;flex-wrap:wrap}
.pill{background:none;border:1px solid transparent;border-radius:999px;padding:6px 14px;color:var(--dim);transition:all .2s}
.pill b{font-weight:400;margin-left:6px;font-size:.78rem;opacity:.7}
.pill:hover{color:var(--text)}
.pill[aria-selected=true]{background:rgba(var(--ac),.13);border-color:var(--line2);color:#fff;box-shadow:0 0 16px rgba(var(--ac),.25)}
#q{flex:1;min-width:180px}
#count{color:var(--dim);font-size:.82rem;white-space:nowrap}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.tile{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);transition:transform .35s var(--ease),box-shadow .3s,border-color .25s}
#v-lib.in .tile:not(.hidden){animation:tileIn .6s var(--ease) backwards;animation-delay:calc(min(var(--t,0),24) * 28ms + 160ms)}
@keyframes tileIn{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
.go{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:none;display:block}
.art{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,rgba(0,0,0,.45),transparent 70%);pointer-events:none}
.art img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art img.small{width:44px;height:44px;border-radius:10px;object-fit:cover;position:relative;z-index:1}
.art .fb{font-weight:800;font-size:1.02rem;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 8px rgba(0,0,0,.55);position:relative;z-index:1}
.cap{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 9px;font-size:.78rem;font-weight:600;text-align:left;background:linear-gradient(transparent,rgba(var(--bgr),.92));opacity:0;transform:translateY(6px);transition:opacity .25s,transform .3s var(--ease);z-index:2}
.tile:hover .cap,.go:focus-visible .cap{opacity:1;transform:none}
.tile:hover{border-color:var(--pumpkin);transform:translateY(-5px) scale(1.04);box-shadow:0 0 0 1px rgba(var(--ac),.4),0 10px 34px rgba(var(--ac),.38);z-index:2}
.tile:active{transform:scale(.97)}
.star{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:9px;border:0;background:rgba(var(--bgr),.62);color:#fff;font-size:1rem;line-height:1;opacity:0;transition:opacity .2s,transform .2s;z-index:3}
.star:hover{transform:scale(1.15)}
.tile:hover .star,.star:focus-visible,.star.on{opacity:1}
.star.on{color:var(--gold);text-shadow:0 0 10px var(--pumpkin)}
#none{padding:60px 0;text-align:center;color:var(--dim)}
@media (hover:none){.star{opacity:.9}.cap{opacity:1;transform:none}}

/* ---------- play ---------- */
#v-play{overflow:hidden;background:#000}
#v-play .nf{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;max-width:min(520px,88%);padding:20px 22px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);text-align:center;box-shadow:0 0 30px rgba(var(--ac),.25)}
#v-play .nf b{display:block;font-size:1.05rem;margin-bottom:6px}
#v-play .nf code{display:block;margin-top:10px;font:.74rem var(--mono);color:var(--gold);word-break:break-all}
#v-play iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}

/* toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:90;padding:9px 16px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2);box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 20px rgba(var(--ac),.2);font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* calm mode */
.calm *,.calm *::before,.calm *::after{animation:none!important;transition:none!important}
.calm #boot,.calm #flash{display:none}

@media (max-width:860px){#mini{display:none}.hcount{font-size:.85rem}.moon{width:64px;height:64px;right:4%}}
@media (max-width:620px){#shell{grid-template-columns:0 1fr}#rail{display:none}.tab{width:130px;flex-basis:130px}}

/* ---------- themes (the default :root above is "Cherry") ---------- */
html[data-theme="pink"]{--bg:#0c050a;--bgr:12,5,10;--pn:30,11,22;--pn2:52,18,38;--panel:#160914;--panel2:#220c1d;--ac:255,110,185;--text:#fdeaf5;--dim:#b890a8;--dim2:#d3adc6;--mute:#916a82;--mute2:#664564;--sb:#4d1c42;--tabA:#2e1027;--tabB:#1b0916;--rvtext:#efd4e6;--subc:#ffb8dc;--pumpkin:#ff6eb9;--ember:#e02e8e;--gold:#ffc0e0;--wisp:#c77dff}
html[data-theme="teal"]{--bg:#030b0c;--bgr:3,11,12;--pn:8,26,28;--pn2:12,44,46;--panel:#07161a;--panel2:#0c2227;--ac:38,208,196;--text:#e4faf8;--dim:#82aaa8;--dim2:#a5cdca;--mute:#5e8886;--mute2:#3d5f5e;--sb:#17474a;--tabA:#0e2d30;--tabB:#08191c;--rvtext:#cfeceb;--subc:#9cf0e8;--pumpkin:#26d0c4;--ember:#0f9aa8;--gold:#8ff2e8;--wisp:#5ab8ff}
html[data-theme="green"]{--bg:#040a05;--bgr:4,10,5;--pn:10,27,14;--pn2:15,45,22;--panel:#08150b;--panel2:#0e2113;--ac:74,214,104;--text:#e8fbea;--dim:#86ab8c;--dim2:#a8cfae;--mute:#628868;--mute2:#3e5f44;--sb:#1b4a26;--tabA:#10301a;--tabB:#09190e;--rvtext:#d1ecd5;--subc:#a6f0b4;--pumpkin:#4ad668;--ember:#26a047;--gold:#b8f58a;--wisp:#7ae0b0}
html[data-theme="black"]{--bg:#000;--bgr:0,0,0;--pn:18,18,18;--pn2:34,34,34;--panel:#0c0c0c;--panel2:#151515;--ac:235,235,235;--text:#f5f5f5;--dim:#9a9a9a;--dim2:#bdbdbd;--mute:#7a7a7a;--mute2:#4d4d4d;--sb:#3a3a3a;--tabA:#222;--tabB:#121212;--rvtext:#dedede;--subc:#cccccc;--pumpkin:#f2f2f2;--ember:#a8a8a8;--gold:#fff;--wisp:#cfcfcf}
html[data-theme="purple"]{--bg:#07040d;--bgr:7,4,13;--pn:20,12,36;--pn2:36,20,64;--panel:#0e0818;--panel2:#170e28;--ac:160,108,255;--text:#f1eaff;--dim:#9d8fbd;--dim2:#bfb2dc;--mute:#7a6c9c;--mute2:#53467a;--sb:#3a2370;--tabA:#22143f;--tabB:#130b26;--rvtext:#e0d6f5;--subc:#cdb8ff;--pumpkin:#a46cff;--ember:#6f3ce0;--gold:#d6bbff;--wisp:#7aa8ff}
html[data-theme="blue"]{--bg:#03070e;--bgr:3,7,14;--pn:9,20,40;--pn2:14,34,68;--panel:#07101f;--panel2:#0c1a33;--ac:70,140,255;--text:#e8f0ff;--dim:#8499bd;--dim2:#a9bde0;--mute:#627a9f;--mute2:#3d5073;--sb:#1d3a73;--tabA:#112649;--tabB:#09152b;--rvtext:#d3def5;--subc:#a8c6ff;--pumpkin:#4a8cff;--ember:#2358d6;--gold:#a8caff;--wisp:#6ae0ff}
/* Classic Halloween = the original look */
html[data-theme="halloween"]{--bg:#09050e;--bgr:9,5,14;--pn:25,13,34;--pn2:55,24,18;--panel:#130b1b;--panel2:#1b1026;--ac:255,130,50;--text:#f7ecdc;--dim:#a893b8;--dim2:#b9a6c8;--mute:#8e7aa0;--mute2:#5d4a70;--sb:#3a2150;--tabA:#2a1330;--tabB:#190d22;--rvtext:#d9c9e6;--subc:#ffcaa0;--pumpkin:#ff7a18;--ember:#ff4a1c;--gold:#ffbd3a;--wisp:#9a63ff}

/* Halloween-only decorations are hidden in every other theme */
html:not([data-theme="halloween"]) :is(.moon,.web,.fog,#vig,#boot,#flash,#hal){display:none!important}
html:not([data-theme="halloween"]) #shell.boot{animation:none}
html:not([data-theme="halloween"]) .logo{width:auto;filter:none}
html:not([data-theme="halloween"]) .sub{letter-spacing:.08em;text-shadow:none;color:var(--dim);font-size:.95rem}
.pk.lock{display:none}
html:not([data-theme="halloween"]) .pk.pump{display:none}
html:not([data-theme="halloween"]) .pk.lock{display:block}

/* wordmark */
.wm{font:800 clamp(64px,13vw,120px)/1 var(--sans);letter-spacing:-.045em;padding:0 .06em .08em;
  background:linear-gradient(180deg,var(--gold),var(--pumpkin) 62%,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(var(--ac),.5))}
.wm.sm{font-size:clamp(48px,10vw,76px)}
html:not([data-theme="halloween"]) .rv .av{background:linear-gradient(135deg,var(--pumpkin),var(--ember))!important;color:#0a0a0a}
#v-home.boot2 .hwrap{animation:rise .6s var(--ease) both}
#v-home.boot2 .reviews{animation:rise .8s ease .15s both}

/* ---------- settings page ---------- */
.sh{margin:26px 0 4px;font-size:1.05rem;font-weight:700}
.sh:first-child{margin-top:0}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:14px 0 6px}
.th{display:flex;flex-direction:column;gap:3px;padding:9px;border-radius:14px;border:1px solid var(--line);background:rgba(var(--pn),.78);text-align:left;transition:border-color .2s,box-shadow .2s,transform .25s var(--ease)}
.th:hover{border-color:var(--pumpkin);transform:translateY(-2px)}
.th[aria-pressed=true]{border-color:var(--pumpkin);box-shadow:var(--glow)}
.th .pv{display:grid;place-items:center;height:62px;margin-bottom:6px;border-radius:9px;border:1px solid rgba(255,255,255,.08)}
.th .pw{font:800 1.5rem/1 var(--sans);letter-spacing:-.04em}
.th .tn{font-weight:600;font-size:.86rem}
.th .ts{font-size:.74rem}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:13px 15px;margin:10px 0;border-radius:12px;border:1px solid var(--line);background:rgba(var(--pn),.7)}
.srow .dim{font-size:.82rem;margin-top:2px}

/* ---------- animations ---------- */
#spot{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;z-index:5;pointer-events:none;background:radial-gradient(circle,rgba(var(--ac),.11),transparent 65%);will-change:transform}
html.playing #spot,.calm #spot{display:none}
body.shake{animation:shake .7s .45s linear}
@keyframes shake{0%,100%{transform:none}12%{transform:translate(-7px,3px)}25%{transform:translate(6px,-4px)}38%{transform:translate(-4px,-3px)}52%{transform:translate(3px,4px)}70%{transform:translate(-2px,1px)}}
/* wordmark: letters drop in, then ripple forever */
.wm{background:none;-webkit-background-clip:border-box;color:inherit;perspective:600px}
.wm i{display:inline-block;font-style:normal;background:linear-gradient(180deg,var(--gold),var(--pumpkin) 62%,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:letterIn .95s var(--ease) calc(.1s + var(--i) * .09s) backwards,wave 4.5s ease-in-out calc(1.4s + var(--i) * .28s) infinite}
@keyframes letterIn{0%{opacity:0;transform:translateY(70px) rotateX(-100deg) scale(.5);filter:blur(10px) brightness(3)}60%{opacity:1;transform:translateY(-8px) rotateX(8deg) scale(1.06);filter:none}100%{transform:none}}
@keyframes wave{0%,100%{transform:translateY(0);filter:brightness(1)}50%{transform:translateY(-7px);filter:brightness(1.35)}}
#logoHome{transition:transform .3s ease-out}
/* idle motion */
.app{animation:bobA 5.5s ease-in-out calc(var(--n,0) * -.7s) infinite}
@keyframes bobA{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.sbar{animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 1px rgba(var(--ac),.28),0 0 26px rgba(var(--ac),.2)}}
.moon{animation:moonp 7s ease-in-out infinite}
@keyframes moonp{50%{box-shadow:0 0 70px 14px rgba(255,205,130,.45),0 0 170px 55px rgba(255,150,60,.24)}}
/* tabs */
.tab{animation-duration:.55s}
@keyframes tabIn{0%{opacity:0;transform:translateY(16px) scale(.55) rotate(-5deg);filter:brightness(2.6)}60%{transform:translateY(-3px) scale(1.07)}100%{opacity:1;transform:none;filter:none}}
.view.portal{animation:portal .85s cubic-bezier(.3,.7,.2,1) both}
@keyframes portal{0%{clip-path:circle(0 at var(--ox) var(--oy));filter:brightness(2.4) saturate(1.6)}100%{clip-path:circle(150% at var(--ox) var(--oy));filter:none}}
/* page transitions */
@keyframes viewIn{0%{opacity:0;transform:scale(1.16);filter:blur(8px)}35%{opacity:1}100%{opacity:1;transform:none;filter:blur(0)}}
#stage[data-dir=b] .view.in{animation:inB .5s var(--ease) backwards}
#stage[data-dir=b] .view.out{animation:outB .26s cubic-bezier(.5,0,.75,0) both}
#stage[data-dir=f] .view.in{animation:inF .5s var(--ease) backwards}
#stage[data-dir=f] .view.out{animation:outF .26s cubic-bezier(.5,0,.75,0) both}
@keyframes inB{from{opacity:0;transform:translateX(-90px) scale(.95)}}
@keyframes outB{to{opacity:0;transform:translateX(90px) scale(.95)}}
@keyframes inF{from{opacity:0;transform:translateX(90px) scale(.95)}}
@keyframes outF{to{opacity:0;transform:translateX(-90px) scale(.95)}}
.nudge svg{animation:nudge .45s var(--ease)}
#bk{--d:-6px}#fw{--d:6px}
@keyframes nudge{40%{transform:translateX(var(--d)) scale(1.15)}}
/* refresh */
#scan{position:absolute;left:0;right:0;top:0;height:130px;z-index:31;pointer-events:none;opacity:0;background:linear-gradient(180deg,transparent,rgba(var(--ac),.3));border-bottom:2px solid rgba(var(--ac),.9);box-shadow:0 10px 36px rgba(var(--ac),.55)}
#scan.run{animation:scan .8s cubic-bezier(.5,0,.3,1)}
@keyframes scan{0%{transform:translateY(-130px);opacity:1}100%{transform:translateY(105vh);opacity:.3}}
.view.glitch{animation:glitch .45s steps(2)}
@keyframes glitch{0%{transform:none}20%{transform:translateX(-7px) skewX(3deg);filter:hue-rotate(45deg) saturate(2)}40%{transform:translateX(6px)}60%{transform:translateX(-3px) skewX(-2deg);filter:none}100%{transform:none}}
/* theme switch */
.wipe{position:fixed;inset:0;z-index:70;pointer-events:none;animation:wipe 1s cubic-bezier(.5,0,.2,1) forwards}
@keyframes wipe{0%{clip-path:circle(0 at var(--x) var(--y));opacity:.9}60%{opacity:.5}100%{clip-path:circle(160% at var(--x) var(--y));opacity:0}}
.logo{width:auto;filter:none}

/* ---------- cleaner pass: softer glows, same motion + particles ---------- */
:root{--glow:0 0 0 1px rgba(var(--ac),.45),0 0 10px rgba(var(--ac),.16)}
.logo{filter:drop-shadow(0 0 10px rgba(var(--ac),.3))}
.sub,.clk,.hcount b,.star.on{text-shadow:none}
.moon{box-shadow:0 0 28px 4px rgba(255,205,130,.22);opacity:.8}
@keyframes moonp{50%{box-shadow:0 0 36px 6px rgba(255,205,130,.28)}}
@keyframes breathe{50%{box-shadow:0 0 0 1px rgba(var(--ac),.25),0 0 12px rgba(var(--ac),.1)}}
.fog{opacity:.28}.fog.b{opacity:.2}
#vig{background:radial-gradient(ellipse at 55% 45%,transparent 65%,rgba(0,0,0,.35))}
.web{opacity:.28}
#glow{opacity:.75}
.rb.on::before,.tab.on::after{box-shadow:none}
/* keep every animation, drop the blur/brightness flashes */
@keyframes letterIn{0%{opacity:0;transform:translateY(50px) scale(.7)}60%{opacity:1;transform:translateY(-6px) scale(1.03)}100%{transform:none}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tabIn{0%{opacity:0;transform:translateY(12px) scale(.8)}100%{opacity:1;transform:none}}
@keyframes portal{0%{clip-path:circle(0 at var(--ox) var(--oy))}100%{clip-path:circle(150% at var(--ox) var(--oy))}}
@keyframes viewIn{0%{opacity:0;transform:scale(1.06)}100%{opacity:1;transform:none}}

/* ---------- flatter, hand-made look ---------- */
:root{--sans:Roboto,Arial,Helvetica,sans-serif;--glow:0 0 0 1px rgba(var(--ac),.6)}
#glow,html[data-theme="halloween"] #glow{background:var(--bg)}
.web,#vig{display:none}
.fog{opacity:.12}.fog.b{opacity:.08}
.logo{filter:none}
.wm i{background:none;color:var(--pumpkin);-webkit-text-fill-color:currentColor}
.sub{letter-spacing:.04em;color:var(--dim2)}
.moon{box-shadow:none;background:#e9d9b8;opacity:.85}
.moon::before{box-shadow:none}
@keyframes moonp{50%{opacity:.7}}
.sbar,.chip,.ctl,.inp,.hcount{border-radius:6px}
.tile{border-radius:8px}
.app .c{border-radius:12px;background:var(--pn)}
.app:hover .c,.app:focus-visible .c{box-shadow:none;transform:translateY(-3px);background:var(--pn2)}
.tile:hover{transform:translateY(-3px);box-shadow:none}
button.chip:hover,.ctl:hover,.trk.on,.sbar:focus-within,.inp:focus{box-shadow:none}
.ctl.pri{background:var(--pumpkin);color:#140700}
.ctl.pri:hover{box-shadow:none;filter:brightness(1.08)}
.pill{border-radius:6px}
.pill[aria-selected=true]{box-shadow:none;background:rgba(var(--ac),.16)}
.dot{box-shadow:none}
.art::after{display:none}
@keyframes breathe{50%{box-shadow:none}}
#toast,#v-play .nf{box-shadow:0 6px 18px rgba(0,0,0,.5)}

/* music browse + AI */
.msec{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.mcard{position:relative;text-align:left;background:none;border:0;padding:0}
.mcard .ma{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font:800 2.4rem var(--sans);color:#fff;border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.mcard:hover .ma{transform:translateY(-3px);box-shadow:var(--glow)}
.mcard.on .ma{box-shadow:var(--glow)}
.mcard b{display:block;margin-top:7px;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard span.s{font-size:.72rem;color:var(--dim)}
.mcard .lk{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.mcard .lk.on{color:var(--pumpkin)}.mcard .lk.on svg{fill:var(--pumpkin)}
#aiw{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:320px}
#aim{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px}
#aim .m{max-width:78%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word;background:rgba(var(--pn),.8);border:1px solid var(--line)}
#aim .m.u{align-self:flex-end;background:rgba(var(--ac),.2)}
#aib{display:flex;gap:8px;margin-top:10px}#aib textarea{flex:1;height:48px;padding:11px 14px;resize:none}
</style>

/* ---------- ambience: embers + bats ---------- */
(() => {
  const cv = $('fx'), cx = cv.getContext('2d');
  let W, H, dpr, ps = [], bats = [], bursts = [], still = false, nextBat = 5000;
  let COLS = ['255,122,24','255,98,20','255,189,58','154,99,255','255,226,180'];
  function make(any){
    return { x: rnd(0, W), y: any ? rnd(0, H) : H + 12, r: rnd(1.1, 3.4), a: rnd(.22, .65), col: COLS[Math.floor(Math.random() * COLS.length)],
      vy: rnd(.25, .95), sw: rnd(.2, .8), ph: rnd(0, 6.28), sp: rnd(.6, 1.6) };
  }
  function size(){
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; still = false; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(70, Math.max(30, W * H / 18000)));
    while (ps.length < n) ps.push(make(true)); ps.length = n;
  }
  addEventListener('resize', size); size();
  const mouse = { x: -999, y: -999 };
  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener('pointerdown', e => {
    if (calmMode) return;
    for (let i = 0; i < 16; i++){
      const a = rnd(0, 6.283), v = rnd(1.5, 6);
      bursts.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, r: rnd(1.2, 3), col: COLS[i % 4] });
    }
  });
  window.gburst = (x, y, n) => { if (calmMode) return; n = n || 16; for (let i = 0; i < n; i++){ const a = rnd(0, 6.283), v = rnd(1.5, 7); bursts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, r: rnd(1.2, 3), col: COLS[i % COLS.length] }); } };
  window.gbats = n => { return; if (calmMode) return; const dir = Math.random() < .5 ? 1 : -1; for (let i = 0; i < n; i++) bats.push({ x: (dir > 0 ? -40 : W + 40) - dir * i * rnd(30, 60), y: rnd(H * .08, H * .6), vx: dir * rnd(2.4, 4), s: rnd(.8, 1.4), fs: rnd(9, 13), ph: rnd(0, 6) }); };
  window.setFxCols = c => { COLS = c; ps.forEach(p => p.col = COLS[Math.floor(Math.random() * COLS.length)]); };
  const sprites = {};
  function spr(col){
    if (sprites[col]) return sprites[col];
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(' + col + ',1)'); gr.addColorStop(.22, 'rgba(' + col + ',1)');
    gr.addColorStop(.32, 'rgba(' + col + ',.35)'); gr.addColorStop(1, 'rgba(' + col + ',0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return sprites[col] = c;
  }
  function bat(b, t){
    const f = Math.sin(t * b.fs + b.ph), w = -9 * f;
    cx.save(); cx.translate(b.x, b.y + Math.sin(t * .8 + b.ph) * 6); cx.scale(b.s * (b.vx < 0 ? -1 : 1), b.s);
    cx.beginPath(); cx.moveTo(0, -4); cx.lineTo(2.4, -8.5); cx.lineTo(4, -4);
    cx.quadraticCurveTo(14, -9 + w * .6, 28, -5 + w);
    cx.quadraticCurveTo(25, 0 + w * .4, 21, 3 + w * .25);
    cx.quadraticCurveTo(17, -1, 13, 5); cx.quadraticCurveTo(9, 1, 4, 8);
    cx.quadraticCurveTo(0, 12, -4, 8); cx.quadraticCurveTo(-9, 1, -13, 5);
    cx.quadraticCurveTo(-17, -1, -21, 3 + w * .25); cx.quadraticCurveTo(-25, 0 + w * .4, -28, -5 + w);
    cx.quadraticCurveTo(-14, -9 + w * .6, -4, -4); cx.lineTo(-2.4, -8.5); cx.closePath();
    cx.fillStyle = '#1c0f2a'; cx.fill(); cx.lineWidth = 1.1; cx.strokeStyle = 'rgba(255,140,70,.55)'; cx.stroke();
    cx.restore();
  }
  let t = 0, last = performance.now();
  function tick(now){
    requestAnimationFrame(tick);
    if (cv.classList.contains('hidden') || document.hidden || document.documentElement.classList.contains('playing')) return;
    const dt = Math.min(now - last, 60); last = now;
    if (calmMode && still && !bursts.length) return;
    still = calmMode; t += .05;
    cx.clearRect(0, 0, W, H);
    for (const p of ps){
      if (!calmMode){
        p.y -= p.vy; p.x += Math.sin(t * p.sp + p.ph) * p.sw;
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
        if (d < 120 && d > 0){ const f = (1 - d / 120) * 4; p.x += dx / d * f; p.y += dy / d * f; }
      }
      if (p.y < -12) Object.assign(p, make(false));
      const R = p.r * 4, tw = calmMode ? 1 : .75 + .25 * Math.sin(t * p.sp * 2 + p.ph);
      cx.globalAlpha = p.a * tw; cx.drawImage(spr(p.col), p.x - R, p.y - R, R * 2, R * 2);
    }
    for (let i = bursts.length - 1; i >= 0; i--){
      const b = bursts[i]; b.x += b.vx; b.y += b.vy; b.vy += .08; b.vx *= .96; b.life -= .026;
      if (b.life <= 0){ bursts.splice(i, 1); continue; }
      const R = b.r * 4; cx.globalAlpha = b.life; cx.drawImage(spr(b.col), b.x - R, b.y - R, R * 2, R * 2);
    }
    cx.globalAlpha = 1;
    if (!calmMode && document.documentElement.dataset.theme === 'halloween'){
      nextBat -= dt;
      if (false){
        nextBat = rnd(9000, 17000);
        const dir = Math.random() < .5 ? 1 : -1, n = Math.random() < .4 ? 3 : 1;
        for (let i = 0; i < n; i++) bats.push({ x: (dir > 0 ? -40 : W + 40) - dir * i * rnd(40, 70), y: rnd(H * .1, H * .5) + i * rnd(-20, 30), vx: dir * rnd(1.8, 2.6), s: rnd(.8, 1.3), fs: rnd(9, 12), ph: rnd(0, 6) });
      }
      for (let i = bats.length - 1; i >= 0; i--){ const b = bats[i]; b.x += b.vx; if (b.x < -90 || b.x > W + 90){ bats.splice(i, 1); continue; } bat(b, t); }
    }
  }
  requestAnimationFrame(tick);
})();

/* ---------- games: loading (kept from your version) ---------- */
let blobs = new Map();

function load(list){
  $('err').classList.add('hidden');
  games = [...list].filter(f => {
    if (!/\.html?$/i.test(f.name)) return false;
    const p = f.webkitRelativePath || f.name;
    return !SKIP_DIRS.test(p) && !SKIP_FILES.test(f.name);
  }).map(f => ({ file: f, id: f.name.toLowerCase(), name: prettify(f.name), key: norm(f.name) }));
  if (!games.length){
    $('err').textContent = 'No HTML games found in that selection. Choose the folder that contains the .html game files.';
    $('err').classList.remove('hidden'); return;
  }
  finish(); nav({ k: 'games' }); $('q').focus();
}

let autoState = 'idle';
const okPath = p => {
  if (SKIP_DIRS.test(p)) return false;
  const parts = p.split('/'), base = parts.pop();
  if (/^index\.html?$/i.test(base)) return parts.length > 1;
  return !SKIP_FILES.test(base);
};
function mkGame(item, prefix){
  const path = typeof item === 'string' ? item : item.file;
  const parts = path.split('/'), file = parts[parts.length - 1];
  const base = /^index\.html?$/i.test(file) && parts.length > 1 ? parts[parts.length - 2] : file;
  return { url: (prefix || '') + parts.map(p => { try { p = decodeURIComponent(p); } catch(e){} return encodeURIComponent(p); }).join('/'), id: base.toLowerCase(),
           name: item.name || prettify(base), key: norm(base), cover: item.icon || null };
}
function finish(){
  games.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
  build(); takePending(); setTab('all'); homeStat();
}
function takePending(){ if (pendingQ){ $('q').value = pendingQ; } pendingQ = ''; }
// Your repo. Change these two lines if you ever rename it.
const REPO = 'cash90954-gif/-crabtreesgames';
const SITE = 'https://cash90954-gif.github.io/-crabtreesgames/';
const onPages = location.hostname.endsWith('.github.io');
let why = [];
async function fromApi(){
  let repo = REPO;
  if (onPages){
    const h = location.hostname, seg = location.pathname.split('/')[1];
    repo = h.split('.')[0] + '/' + ((!seg || /\.html?$/i.test(seg)) ? h : seg);
  }
  const r = await fetch('https://api.github.com/repos/' + repo + '/git/trees/HEAD?recursive=1');
  if (!r.ok) throw new Error('GitHub list error ' + r.status + (r.status === 403 ? ' (rate limit or blocked)' : ''));
  const j = await r.json();
  return j.tree.filter(x => x.type === 'blob' && /^offline\/.+\.html?$/i.test(x.path)).map(x => x.path);
}
function failMsg(){
  $('err').textContent = "Couldn't load the game list automatically. Choose the offline folder below instead." + (why.length ? ' (' + why.join('; ') + ')' : '');
  $('err').classList.remove('hidden');
}
const cleanList = l => (Array.isArray(l) ? l : []).filter(x => { const p = typeof x === 'string' ? x : x && x.file; return typeof p === 'string' && /\.html?$/i.test(p) && okPath(p); });
const onGamesRoute = () => { const t = act(); return t && rt(t).k === 'games'; };
async function autoLoad(){
  // OFFLINE MODE: never contact GitHub or use a saved GitHub list.
  try { localStorage.removeItem('gl-list'); } catch(e){}
  autoState = 'offline'; homeStat(); return;
  /* original online loader below is disabled */
  autoState = 'loading'; why = []; homeStat();
  let cached = null;
  try { const c = JSON.parse(localStorage.getItem('gl-list') || 'null'); if (c && cleanList(c.list).length) cached = c; } catch(e){}
  if (cached){ games = cleanList(cached.list).map(x => mkGame(x, cached.base || '')); autoState = 'ok'; finish(); if (onGamesRoute() && curView === 'start') render(); }
  let list = null, base = '';
  try {
    const r = await fetch('games.json', { cache: 'no-cache' });
    if (r.ok){ const j = await r.json(); if (Array.isArray(j) && j.length) list = j; else why.push('games.json is empty'); }
    else why.push('no games.json (' + r.status + ')');
  } catch(e){ why.push('games.json unavailable'); }
  if (!list){ try { list = await fromApi(); if (!onPages) base = SITE; } catch(e){ why.push((e && e.message) || 'GitHub list blocked'); } }
  list = cleanList(list);
  if (list.length){
    if (!cached || JSON.stringify(list) !== JSON.stringify(cleanList(cached.list)) || (cached.base || '') !== base){
      try { localStorage.setItem('gl-list', JSON.stringify({ list, base })); } catch(e){}
      games = list.map(x => mkGame(x, base)); autoState = 'ok'; finish();
      if (onGamesRoute() && curView === 'start') render();
    }
    homeStat(); return;
  }
  if (cached) return;
  autoState = 'fail'; homeStat();
  if (onGamesRoute() && curView === 'lib'){ failMsg(); render(); }
}

function paint(g){
  const art = g.art; art.textContent = '';

const saveLinks = () => { try { localStorage.setItem('gl-links', JSON.stringify(links)); } catch(e){} };
const BUILT = [['games','Games'],['music','Music'],['ai','bluu AI'],['notes','Notes'],['clock','Clock'],['settings','Settings']];
function mk(label, inner, fn){
  const b = document.createElement('button'); b.type = 'button'; b.className = 'app';
  b.innerHTML = '<span class="c">' + inner + '</span><span></span>';
  b.lastChild.textContent = label; b.onclick = fn; return b;
}
function renderApps(el, full){
  el.textContent = '';
  BUILT.forEach(([k, n]) => el.append(mk(n, ico(k), e => go(k === 'games' ? { k: 'games' } : { k: 'app', key: k }, e))));
  links.forEach((l, i) => {
    const b = mk(l.name, '', () => window.open(l.url, '_blank', 'noopener'));
    b.firstChild.textContent = (l.name.match(/[A-Za-z0-9]/) || ['?'])[0].toUpperCase();
    if (full){
      const wrap = document.createElement('div'); wrap.style.position = 'relative';
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '\u00d7'; x.setAttribute('aria-label', 'Remove ' + l.name);
      x.onclick = () => { links.splice(i, 1); saveLinks(); renderApps(el, true); renderApps($('apps')); };
      wrap.append(b, x); el.append(wrap);
    } else el.append(b);
  });
  el.append(mk('Add', ico('add'), e => go({ k: 'app', key: 'add' }, e)));
  if (!full) el.append(mk('All Apps', ico('all'), e => go({ k: 'app', key: 'all' }, e)));
  [...el.children].forEach((c, i) => c.style.setProperty('--n', i));
}

const au = new Audio(); let tracks = [], ti = -1;
let liked = new Set(); try { liked = new Set(JSON.parse(localStorage.getItem('gl-liked') || '[]')); } catch(e){}
const playAu = () => { const p = au.play(); if (p && p.catch) p.catch(() => {}); };
const trackName = t => t.name.replace(/\.[^.]+$/, '');
function musicUI(){
  const live = ti >= 0;
  $('mini').classList.toggle('live', live);
  $('miniT').querySelector('span').textContent = live ? trackName(tracks[ti]) : 'Nothing playing';
  $('mPlay').innerHTML = ico(au.paused ? 'play' : 'pause');
  [$('mPrev'), $('mPlay'), $('mNext')].forEach(b => b.disabled = !tracks.length);
  if ($('ml')){
    $('ml').textContent = '';
    const q = ($('mq') ? $('mq').value : '').toLowerCase();
    const card = (t, i) => { const nm = trackName(t), h = hue(nm) % 360, x = document.createElement('div'); x.className = 'mcard' + (i === ti ? ' on' : ''); x.style.position = 'relative';
      const a = document.createElement('button'); a.className = 'mcard'; a.style.cssText = 'width:100%'; a.innerHTML = '<div class="ma"></div><b></b><span class="s">Local song</span>';
      a.querySelector('.ma').textContent = (nm.match(/[A-Za-z0-9]/) || ['?'])[0].toUpperCase(); a.querySelector('.ma').style.background = 'linear-gradient(135deg,hsl(' + h + ' 60% 42%),hsl(' + (h + 40) % 360 + ' 55% 16%))';
      a.querySelector('b').textContent = nm; a.onclick = () => goTrack(i);
      const l = document.createElement('button'); l.className = 'lk' + (liked.has(nm) ? ' on' : ''); l.innerHTML = ico('heart'); l.setAttribute('aria-label', 'Like ' + nm);
      l.onclick = e => { e.stopPropagation(); liked.has(nm) ? liked.delete(nm) : liked.add(nm); try { localStorage.setItem('gl-liked', JSON.stringify([...liked])); } catch(er){} musicUI(); };
      x.append(a, l); return x; };
    const sec = (title, list) => { if (!list.length) return; const h = document.createElement('div'); h.className = 'msec'; h.textContent = title; const g = document.createElement('div'); g.className = 'mgrid'; list.forEach(([t, i]) => g.append(card(t, i))); $('ml').append(h, g); };
    const all = tracks.map((t, i) => [t, i]).filter(([t]) => trackName(t).toLowerCase().includes(q));
    sec('Liked Mix', all.filter(([t]) => liked.has(trackName(t)))); sec('Your Library', all);
    $('now').textContent = live ? 'Now playing: ' + trackName(tracks[ti]) : '';
    $('pp').innerHTML = ico(au.paused ? 'play' : 'pause') + (au.paused ? 'Play' : 'Pause');
  }
}
function goTrack(i){ if (!tracks.length) return; ti = (i + tracks.length) % tracks.length; au.src = tracks[ti].url; playAu(); musicUI(); }
$('mPrev').onclick = () => goTrack(ti - 1); $('mNext').onclick = () => goTrack(ti + 1);
$('mPlay').onclick = () => { if (ti < 0) return goTrack(0); au.paused ? playAu() : au.pause(); };
$('miniT').onclick = e => go({ k: 'app', key: 'music' }, e);
au.onplay = au.onpause = musicUI; au.onended = () => goTrack(ti + 1);
au.ontimeupdate = () => { const s = $('seek'); if (s && au.duration) s.value = au.currentTime / au.duration * 1000; };
musicUI();
